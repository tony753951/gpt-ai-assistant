services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    ports:
      # 管理介面只綁本機，請用 SSH 通道連線：ssh -L 3000:127.0.0.1:3000 user@VPS
      - "127.0.0.1:3000:3000/tcp"
      # 本機測試用的一般 DNS（不對外開放，避免被當成開放解析器濫用）
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
      # DNS-over-HTTPS (iPhone 描述檔使用)
      - "443:443/tcp"
      - "443:443/udp"
      # DNS-over-TLS / DNS-over-QUIC
      - "853:853/tcp"
      - "853:853/udp"
    volumes:
      - ./data/work:/opt/adguardhome/work
      - ./data/conf:/opt/adguardhome/conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
